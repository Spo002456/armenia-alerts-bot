name: Armenia travel alerts

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: armenia-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "armenia-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json || true
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "Update alert state"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push failed, retrying in 5s ($i/5)..."
            sleep 5
          done
          exit 1
