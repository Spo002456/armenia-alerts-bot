name: Armenia travel alerts

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes (GitHub may delay a few minutes)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write             # to commit state.json

concurrency:
  group: armenia-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check sources and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bot.py

      - name: Save state
        if: always()
        run: |
          git config user.name "armenia-alerts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "Update alert state" && git push)
